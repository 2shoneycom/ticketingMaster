name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build & test
        working-directory: backend
        env:
            # CI엔 .env가 없어 테스트 yaml의 placeholder가 안 풀림 → 더미값 주입 (실제 DB는 Testcontainers가 처리)
            ORACLE_USER: testuser
            ORACLE_PASSWORD: testpass
            MAIL_USERNAME: ci@test.com
            MAIL_PASSWORD: testpass
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # backend/frontend 가 모두 통과했고, main 브랜치 push 일 때만 배포
  deploy:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 & redeploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/ticketingMaster
            git fetch origin main
            git reset --hard ${{ github.sha }}   # CI 통과한 커밋으로 고정 (.env 는 untracked 라 보존)
            docker compose -f docker-compose.prod.yml up -d --build
